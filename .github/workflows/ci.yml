name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - name: Fresh-install packed npm artifact
        run: |
          npm pack
          mkdir "$RUNNER_TEMP/contextadapt-smoke"
          cd "$RUNNER_TEMP/contextadapt-smoke"
          npm init -y
          npm install "$GITHUB_WORKSPACE"/contextadapt-*.tgz
          npx contextadapt demo

  python-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run frozen v0.1 oracle suite
        working-directory: research/python
        run: python -m unittest discover -s tests -v
