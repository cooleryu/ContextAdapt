name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/contextadapt-*.whl
      - name: Run installed product demo outside the checkout
        run: cd "$RUNNER_TEMP" && contextadapt demo
