[metadata]
name = contextadapt
version = 0.1.0
description = Provenance-aware context diagnostics for AI agent trajectories
long_description = file: README.md
long_description_content_type = text/markdown
author = ContextAdapt contributors
url = https://github.com/cooleryu/ContextAdapt
project_urls =
    Documentation = https://github.com/cooleryu/ContextAdapt#readme
    Issues = https://github.com/cooleryu/ContextAdapt/issues
    Source = https://github.com/cooleryu/ContextAdapt
license = Apache-2.0
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Software Development :: Testing

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = contextadapt*

[options.entry_points]
console_scripts =
    contextadapt = contextadapt.cli:main
