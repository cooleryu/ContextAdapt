<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">ContextAdapt catches a stale Agent action before execution</title>
  <desc id="desc">An old staging request is replaced by a current production request, but a delayed action still points to the old request. ContextAdapt blocks it with two provenance risks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#02040b" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fb7185"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#93c5fd">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200"/>
    <path d="M120 0V560M240 0V560M360 0V560M480 0V560M600 0V560M720 0V560M840 0V560M960 0V560M1080 0V560"/>
  </g>

  <text x="56" y="58" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="700">The plan is complete. The context is obsolete.</text>
  <text x="56" y="88" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="16">ContextAdapt checks what an Agent action is based on before the action runs.</text>

  <g filter="url(#shadow)">
    <rect x="56" y="136" width="300" height="150" rx="16" fill="#171b2c" stroke="#f59e0b" stroke-width="2"/>
    <text x="80" y="171" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">SEQ 10 · SUPERSEDED</text>
    <text x="80" y="211" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="21" font-weight="650">Old request</text>
    <text x="80" y="243" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">staging · timeout=30</text>
    <text x="80" y="268" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">protected edit allowed</text>

    <rect x="450" y="136" width="300" height="150" rx="16" fill="#13231f" stroke="#34d399" stroke-width="2"/>
    <text x="474" y="171" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">SEQ 30 · CURRENT</text>
    <text x="474" y="211" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="21" font-weight="650">Replacement request</text>
    <text x="474" y="243" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">production · timeout=60</text>
    <text x="474" y="268" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">protected edit forbidden</text>

    <rect x="844" y="136" width="300" height="150" rx="16" fill="#251522" stroke="#fb7185" stroke-width="2"/>
    <text x="868" y="171" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">SEQ 50 · CANDIDATE ACTION</text>
    <text x="868" y="211" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="21" font-weight="650">Delayed old plan</text>
    <text x="868" y="243" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">staging/config.json</text>
    <text x="868" y="268" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">timeout=30 · protected edit</text>
  </g>

  <path d="M356 190 C396 170 410 170 450 190" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="371" y="157" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">replaced by</text>
  <path d="M356 262 C560 355 710 355 844 262" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
  <text x="542" y="350" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">action still based on old request</text>

  <g filter="url(#shadow)">
    <rect x="248" y="390" width="704" height="105" rx="18" fill="#32131c" stroke="#fb7185" stroke-width="2"/>
    <circle cx="293" cy="442" r="23" fill="#fb7185"/>
    <path d="M283 432L303 452M303 432L283 452" stroke="#32131c" stroke-width="5" stroke-linecap="round"/>
    <text x="334" y="432" fill="#fecdd3" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">CONTEXTADAPT VERDICT</text>
    <text x="334" y="464" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="750">BLOCK · stale source + invalid permission</text>
  </g>

  <text x="56" y="530" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">local · deterministic · no API key · Apache-2.0</text>
</svg>
